# SPDX-License-Identifier: MIT
# mpv settings for Glasir. Glasir passes the capture options on mpv's command
# line; this file holds only what does not depend on glasir.ini.

# Only Glasir's own key bindings (input.conf).
input-default-bindings=no
input-builtin-bindings=no
drag-and-drop=no

osd-duration=1000

# Scaling down (a 4K capture on a 1440p screen, or "Scale to" above the
# screen's size): Lanczos, not mpv's default. That, a Hermite curve, has no
# negative lobes and softens what it is given: a 4K capture came out softer
# than the same console captured at 1440p (measured on a Live Gamer Ultra 2.1,
# 2026-11-20). With Lanczos it is as sharp, and thin lines the 1440p capture
# breaks up come out whole. It also takes ArtCNN's doubled picture down to the
# window where that is less than twice the capture (1080p in 1440p). Lanczos
# has negative lobes: very hard edges (small HUD text on black) can show a
# faint fringe, which dscale-antiring would damp if it ever shows.
dscale=lanczos

screenshot-format=jpg
screenshot-jpeg-quality=95
screenshot-template="Glasir_%tY-%tm-%td_%tH%tM%tS"
