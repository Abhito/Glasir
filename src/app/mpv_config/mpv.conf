# SPDX-License-Identifier: MIT
# mpv settings for Glasir. Glasir passes the capture options on mpv's command
# line; this file holds only what does not depend on glasir.ini.

# Only Glasir's own key bindings (input.conf).
input-default-bindings=no
input-builtin-bindings=no
drag-and-drop=no

osd-duration=1000

screenshot-format=jpg
screenshot-jpeg-quality=95
screenshot-template="Glasir_%tY-%tm-%td_%tH%tM%tS"
