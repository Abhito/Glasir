# Glasir's keys in mpv. While the in-game menu (Tab) is open, keys go to it
# instead, so Esc there closes the menu; with the menu closed it quits.
#
# Nothing here uses mpv's OSD (no-osd): Glasir's overlay shows what changed,
# after DLSS 5 and frame generation, as toasts at the top of the picture.

MBTN_LEFT_DBL cycle fullscreen
f cycle fullscreen
F cycle fullscreen
s no-osd screenshot video; script-message glasir-toast "Screenshot saved"
S no-osd screenshot video; script-message glasir-toast "Screenshot saved"
q quit
Q quit
ESC quit

# Sound (glasir_audio.dll follows mpv's volume and mute).
UP no-osd add volume 5
DOWN no-osd add volume -5
WHEEL_UP no-osd add volume 5
WHEEL_DOWN no-osd add volume -5
m no-osd cycle mute
M no-osd cycle mute
Ctrl+UP script-message glasir-audio-boost +25
Ctrl+DOWN script-message glasir-audio-boost -25
] script-message glasir-audio-delay +10
[ script-message glasir-audio-delay -10
Ctrl+r script-message glasir-audio-restart
